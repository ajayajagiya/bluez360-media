# Blueezee's test questions — Bluez360 spec 15 §8.
#
# Run against the help pages before pushing them to main, and before deploying
# the help_chat function. Each question passes when Blueezee's answer names the
# expected page among its sources, or — for `expect: unknown` — when she says
# "I don't know". A wrong page, a made-up answer or a missed "I don't know"
# fails the run: fix the page, not the test.
#
# `expect` is one page id, a list of ids (any one of them passes), or unknown.

